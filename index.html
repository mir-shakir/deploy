<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMU Schedule PDF Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 1.5rem; font-weight: bold; text-align: center; margin: 20px 0; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); width: 90%; max-width: 600px; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        label { font-weight: bold; margin-bottom: 5px; display: block; }
        input[type="number"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .hint-text { display: block; font-size: 0.75rem; color: #6b7280; margin-top: -3px; margin-bottom: 7px; }
        .btn { width: 100%; padding: 10px; font-size: 1rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .btn-blue { background-color: #3b82f6; color: white; }
        .btn-green { background-color: #16a34a; color: white; }
        .btn-red { background-color: #dc2626; color: white; padding: 5px 10px; font-size: 0.8rem; margin-top: 5px; }
        .entry-row { border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        #message { display: none; margin-top: 15px; font-weight: bold; text-align: center; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>MMU Tour Schedule - PDF Generator</h1>
    <div class="container">
        <form id="pdfForm">
            <div class="row">
                <div class="form-group">
                    <label for="month">Month</label>
                    <small class="hint-text">e.g., 1 for Jan</small>
                    <input id="month" name="month" type="number" min="1" max="12" required>
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <small class="hint-text">e.g., 2025</small>
                    <input id="year" name="year" type="number" min="2000" max="2100" required>
                </div>
            </div>
            <h2>Schedule Entries</h2>
            <div id="entries"></div>
            <button type="button" onclick="addRow()" class="btn btn-blue">+ Add Row</button>
            <button type="submit" id="generateBtn" class="btn btn-green">Generate PDF</button>
        </form>
        <p id="message"></p>
    </div>

<script>
    document.getElementById('year').value = new Date().getFullYear();
    document.getElementById('month').value = new Date().getMonth() + 1;
    let entryCounter = 0;

    function addRow() {
        const entriesDiv = document.getElementById('entries');
        const row = document.createElement('div');
        row.className = 'entry-row';
        row.innerHTML = `
            <label>Date (DD only)</label>
            <input type="number" min="1" max="31" name="day_${entryCounter}" required>
            <label>Venue</label>
            <input type="text" name="venue_${entryCounter}" required>
            <label>Block</label>
            <input type="text" name="block_${entryCounter}" required>
            <button type="button" class="btn btn-red" onclick="this.parentElement.remove()">Remove</button>
        `;
        entriesDiv.appendChild(row);
        entryCounter++;
    }

    document.getElementById('pdfForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const generateBtn = document.getElementById('generateBtn');
        const message = document.getElementById('message');
        
        generateBtn.disabled = true;
        generateBtn.textContent = 'Generating...';
        message.textContent = '';
        message.style.display = 'none';

        const formData = new FormData(e.target);
        const entries = [];
        for (let i = 0; i < entryCounter; i++) {
            if (formData.has(`day_${i}`)) {
                entries.push({
                    day: formData.get(`day_${i}`),
                    venue: formData.get(`venue_${i}`),
                    block: formData.get(`block_${i}`),
                });
            }
        }

        const data = {
            month: formData.get('month'),
            year: formData.get('year'),
            entries: entries
        };

        try {
            // This sends the data to the PDF engine
            const response = await fetch('/api/pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
            });

            if (!response.ok) {
                throw new Error(`Server error: ${response.statusText}`);
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            const monthName = new Date(data.year, data.month - 1).toLocaleString('default', { month: 'long' });
            a.download = `MMU_Schedule_${monthName}_${data.year}.pdf`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            
            message.textContent = 'PDF downloaded successfully!';
            message.className = 'success';
            message.style.display = 'block';

        } catch (error) {
            message.textContent = 'Failed to generate PDF. Please try again.';
            message.className = 'error';
            message.style.display = 'block';
            console.error(error);
        } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = 'Generate PDF';
        }
    });
    addRow();
</script>
</body>
</html>
