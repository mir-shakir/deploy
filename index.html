<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MMU Schedule PDF Generator</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font-family: Arial, sans-serif; background:#f3f4f6; margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; }
  h1 { font-size:1.5rem; margin:20px 0; text-align:center; }
  .container { background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,.1); width:90%; max-width:600px; }
  .row { display:flex; gap:10px; margin-bottom:15px; }
  .form-group { flex:1; }
  label { font-weight:600; display:block; margin-bottom:4px; }
  input[type="number"], input[type="text"] { width:100%; padding:8px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; }
  .hint-text { font-size:.7rem; color:#6b7280; margin:-2px 0 6px; display:block; }
  .btn { width:100%; padding:10px; font-weight:600; border:none; border-radius:5px; cursor:pointer; margin-top:10px; }
  .btn:disabled { background:#9ca3af; cursor:not-allowed; }
  .btn-blue { background:#2563eb; color:#fff; }
  .btn-green { background:#16a34a; color:#fff; }
  .btn-red { background:#dc2626; color:#fff; padding:5px 10px; width:auto; font-size:.75rem; margin-top:6px; }
  .entry-row { border:1px solid #ddd; padding:10px; border-radius:6px; margin-bottom:10px; background:#fafafa; }
  #previewTable { width:100%; border-collapse:collapse; margin-top:12px; font-size:.85rem; }
  #previewTable th, #previewTable td { border:1px solid #ccc; padding:6px; text-align:center; }
  #message { margin-top:15px; font-weight:600; text-align:center; }
</style>
</head>
<body>
  <h1>MMU Tour Schedule - PDF Generator</h1>
  <div class="container">
    <div class="row">
      <div class="form-group">
        <label for="month">Month</label>
        <small class="hint-text">1–12</small>
        <input id="month" type="number" min="1" max="12" oninput="updatePreview()">
      </div>
      <div class="form-group">
        <label for="year">Year</label>
        <small class="hint-text">e.g. 2025</small>
        <input id="year" type="number" min="2000" max="2100" oninput="updatePreview()">
      </div>
    </div>
    <h2>Schedule Entries</h2>
    <div id="entries"></div>
    <button type="button" onclick="addRow()" class="btn btn-blue">+ Add Row</button>
    <button id="generateBtn" type="button" class="btn btn-green">Generate PDF</button>
    <h3 style="margin-top:30px;">Preview of Entries</h3>
    <table id="previewTable">
      <thead><tr><th>S. No</th><th>Date</th><th>Venue</th><th>Block</th></tr></thead>
      <tbody id="previewBody"></tbody>
    </table>
    <p id="message"></p>
  </div>

<script>
  document.getElementById('year').value = new Date().getFullYear();
  document.getElementById('month').value = new Date().getMonth() + 1;

  function addRow() {
    const entriesDiv = document.getElementById('entries');
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.innerHTML = `
      <label>Date (DD 1–31)</label>
      <input type="number" min="1" max="31" class="date-field" oninput="updatePreview()">
      <label>Venue</label>
      <input type="text" oninput="updatePreview()">
      <label>Block</label>
      <input type="text" oninput="updatePreview()">
      <button type="button" class="btn btn-red" onclick="this.parentElement.remove();updatePreview();">Remove</button>
    `;
    entriesDiv.appendChild(row);
    updatePreview();
  }

  function updatePreview() {
    const month = document.getElementById('month').value;
    const year = document.getElementById('year').value;
    const rows = document.querySelectorAll('#entries .entry-row');
    const tbody = document.getElementById('previewBody');
    tbody.innerHTML = '';
    if (!month || !year) return;
    let serial = 1;
    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      const day = inputs[0].value;
      if (!day) return;
      const fullDate = String(day).padStart(2,'0') + '.' + String(month).padStart(2,'0') + '.' + year;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${serial++}</td><td>${fullDate}</td><td>${inputs[1].value}</td><td>${inputs[2].value}</td>`;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('generateBtn').addEventListener('click', async () => {
    const btn = document.getElementById('generateBtn');
    const msg = document.getElementById('message');
    const month = document.getElementById('month').value;
    const year = document.getElementById('year').value;

    msg.textContent = '';
    if (!month || !year) {
      msg.textContent = 'Month and Year required.';
      msg.style.color = 'red';
      return;
    }
    if (month < 1 || month > 12) {
      msg.textContent = 'Month must be 1–12.';
      msg.style.color = 'red';
      return;
    }

    const entries = [];
    document.querySelectorAll('#entries .entry-row').forEach(row => {
      const inputs = row.querySelectorAll('input');
      if (inputs[0].value) {
        entries.push({
          day: inputs[0].value.trim(),
          venue: inputs[1].value.trim(),
          block: inputs[2].value.trim()
        });
      }
    });

    if (entries.length === 0) {
      msg.textContent = 'Add at least one entry with a day.';
      msg.style.color = 'red';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Generating...';

    try {
      const res = await fetch('/api/pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ month, year, entries })
      });
      if (!res.ok) {
        let details = '';
        try { const j = await res.json(); details = j.error || ''; } catch {}
        throw new Error(details || 'Server error');
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const monthName = new Date(year, month - 1).toLocaleString('default', { month: 'long' });
      a.href = url;
      a.download = `MMU_Schedule_${monthName}_${year}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      msg.textContent = 'PDF downloaded successfully.';
      msg.style.color = 'green';
    } catch (e) {
      msg.textContent = 'Failed: ' + e.message;
      msg.style.color = 'red';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate PDF';
    }
  });

  addRow();
</script>
</body>
</html>
