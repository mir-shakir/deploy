<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The System Design Primer</title>
    <!-- Marked.js for parsing markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle Table of Contents">
            ☰
        </button>
        <h1>System Design Primer</h1>
        <div class="header-actions">
            <button id="reset-progress" class="action-btn" title="Reset all progress">Reset Progress</button>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar for Table of Contents -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Table of Contents</h2>
            </div>
            <nav id="toc" class="toc-nav">
                <!-- TOC will be dynamically injected here -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <div id="content" class="markdown-body">
                <!-- Markdown content will be dynamically injected here -->
                <p>Loading content...</p>
            </div>
        </main>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <script src="app.js"></script>
</body>
</html>
