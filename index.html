<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMU Schedule PDF Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 1.5rem; font-weight: bold; text-align: center; margin: 20px 0; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); width: 90%; max-width: 600px; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        label { font-weight: bold; margin-bottom: 5px; display: block; }
        input[type="number"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .hint-text { display: block; font-size: 0.75rem; color: #6b7280; margin-top: -3px; margin-bottom: 7px; }
        .btn { width: 100%; padding: 10px; font-size: 1rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .btn-blue { background-color: #3b82f6; color: white; }
        .btn-green { background-color: #16a34a; color: white; }
        .btn-red { background-color: #dc2626; color: white; padding: 5px 10px; font-size: 0.8rem; margin-top: 5px; }
        .entry-row { border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        #previewTable { width: 100%; border-collapse: collapse; margin-top: 15px; }
        #previewTable th, #previewTable td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        #message { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <h1>MMU Tour Schedule - PDF Generator</h1>
    <div class="container">
        <div class="row">
            <div class="form-group">
                <label for="month">Month</label>
                <small class="hint-text">e.g., 1 for Jan</small>
                <input id="month" type="number" min="1" max="12" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label for="year">Year</label>
                <small class="hint-text">e.g., 2025</small>
                <input id="year" type="number" min="2000" max="2100" oninput="updatePreview()">
            </div>
        </div>
        <h2>Schedule Entries</h2>
        <div id="entries"></div>
        <button onclick="addRow()" class="btn btn-blue">+ Add Row</button>
        <button id="generateBtn" class="btn btn-green">Generate PDF</button>
        <h3>Preview of Entries</h3>
        <table id="previewTable">
            <thead><tr><th>S. No</th><th>Date</th><th>Venue</th><th>Block</th></tr></thead>
            <tbody id="previewBody"></tbody>
        </table>
        <p id="message"></p>
    </div>

<script>
    document.getElementById('year').value = new Date().getFullYear();
    document.getElementById('month').value = new Date().getMonth() + 1;

    function addRow() {
        const entriesDiv = document.getElementById('entries');
        const row = document.createElement('div');
        row.className = 'entry-row';
        row.innerHTML = `
            <label>Date (DD only)</label>
            <input type="number" min="1" max="31" class="date-field" oninput="updatePreview()">
            <label>Venue</label>
            <input type="text" oninput="updatePreview()">
            <label>Block</label>
            <input type="text" oninput="updatePreview()">
            <button type="button" class="btn btn-red" onclick="this.parentElement.remove();updatePreview();">Remove</button>
        `;
        entriesDiv.appendChild(row);
        updatePreview();
    }

    function updatePreview() {
        const month = document.getElementById('month').value;
        const year = document.getElementById('year').value;
        const rows = document.querySelectorAll('#entries .entry-row');
        const tbody = document.getElementById('previewBody');
        tbody.innerHTML = '';
        if (!month || !year) return;

        rows.forEach((row, i) => {
            const inputs = row.querySelectorAll('input');
            const day = inputs[0].value;
            if (!day) return;
            const fullDate = String(day).padStart(2, '0') + '.' + String(month).padStart(2, '0') + '.' + year;
            tbody.innerHTML += `<tr><td>${i + 1}</td><td>${fullDate}</td><td>${inputs[1].value}</td><td>${inputs[2].value}</td></tr>`;
        });
    }

    document.getElementById('generateBtn').addEventListener('click', async () => {
        const generateBtn = document.getElementById('generateBtn');
        const message = document.getElementById('message');
        
        generateBtn.disabled = true;
        generateBtn.textContent = 'Generating...';
        message.textContent = '';

        const entries = [];
        document.querySelectorAll('#entries .entry-row').forEach(row => {
            const inputs = row.querySelectorAll('input');
            if (inputs[0].value) {
                entries.push({
                    day: inputs[0].value,
                    venue: inputs[1].value,
                    block: inputs[2].value,
                });
            }
        });

        const data = {
            month: document.getElementById('month').value,
            year: document.getElementById('year').value,
            entries: entries
        };

        try {
            const response = await fetch('/api/pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
            });

            if (!response.ok) throw new Error(`Server error: ${await response.text()}`);
            
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const monthName = new Date(data.year, data.month - 1).toLocaleString('default', { month: 'long' });
            a.download = `MMU_Schedule_${monthName}_${data.year}.pdf`;
            a.click();
            window.URL.revokeObjectURL(url);
            
            message.textContent = 'PDF downloaded successfully!';
            message.style.color = 'green';
        } catch (error) {
            message.textContent = 'Failed to generate PDF. Please try again.';
            message.style.color = 'red';
            console.error(error);
        } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = 'Generate PDF';
        }
    });
    
    // Initial setup
    addRow();
</script>
</body>
</html>
