<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMU Schedule PDF Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 1.5rem; font-weight: bold; text-align: center; margin: 20px 0; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); width: 90%; max-width: 600px; margin-bottom: 20px; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 200px; }
        label { font-weight: bold; margin-bottom: 5px; display: block; }
        input[type="number"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .hint-text { display: block; font-size: 0.75rem; color: #6b7280; margin-top: -3px; margin-bottom: 7px; }
        .btn { width: 100%; padding: 10px; font-size: 1rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-blue { background-color: #3b82f6; color: white; }
        .btn-green { background-color: #16a34a; color: white; }
        .btn-red { background-color: #dc2626; color: white; padding: 5px 10px; font-size: 0.8rem; margin-top: 5px; }
        .entry-row { border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-bottom: 10px; position: relative; }
        .btn-remove {
            position: absolute;
            top: 5px;
            right: 5px;
            border: none;
            background: transparent;
            font-size: 1.5rem;
            cursor: pointer;
        }
        #previewTable { width: 100%; border-collapse: collapse; margin-top: 15px; }
        #previewTable th, #previewTable td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MMU Tour Schedule - PDF Generator</h1>

        <div class="row">
            <div class="form-group">
                <label for="month">Month</label>
                <small class="hint-text">e.g., 1 for Jan, 05 for May</small>
                <input id="month" type="number" min="1" max="12" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label for="year">Year</label>
                <small class="hint-text">e.g., 2025</small>
                <input id="year" type="number" min="2000" max="2100" oninput="updatePreview()">
            </div>
             <div class="form-group">
                <label for="doc_date">Document Date</label>
                <small class="hint-text">Format: DD.MM.YYYY</small>
                <input id="doc_date" type="text">
            </div>
        </div>

        <h2>Schedule Entries</h2>
        <div id="entries"></div>
        <button onclick="addRow()" class="btn btn-blue">+ Add Row</button>
        <button onclick="generatePreview()" class="btn btn-green">Preview & Create PDF</button>

        <h3>Preview of Entries</h3>
        <table id="previewTable">
            <thead><tr><th>S. No</th><th>Date</th><th>Venue</th><th>Block</th></tr></thead>
            <tbody id="previewBody"></tbody>
        </table>
    </div>

<script>
    // --- Auto-fill date fields on page load ---
    const today = new Date();
    document.getElementById('year').value = today.getFullYear();
    document.getElementById('month').value = today.getMonth() + 1;
    // Auto-fill the new Document Date field
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();
    document.getElementById('doc_date').value = `${day}.${month}.${year}`;


    function addRow() {
        const entriesDiv = document.getElementById('entries');
        const row = document.createElement('div');
        row.className = 'entry-row';
        row.innerHTML = `
            <label>Date (DD only, 1-31)</label>
            <input type="number" min="1" max="31" class="date-field" oninput="updatePreview()">
            <label>Venue</label>
            <input type="text" oninput="updatePreview()">
            <label>Block</label>
            <input type="text" oninput="updatePreview()">
            <button type="button" class="btn-remove" onclick="this.parentElement.remove(); updatePreview();">&times;</button>
            <button class="btn-move-up" onclick="moveRow(this, 'up')">🔼</button>
            <button class="btn-move-down" onclick="moveRow(this, 'down')">🔽</button>
        `;
        entriesDiv.appendChild(row);
        updatePreview();
    }

    function moveRow(buttonEl, direction) {
        const row = buttonEl.parentElement;
        if (direction === 'up') {
            if (row.previousElementSibling) {
                row.parentElement.insertBefore(row, row.previousElementSibling);
            }
        } else if (direction === 'down') {
            if (row.nextElementSibling) {
                row.parentElement.insertBefore(row.nextElementSibling, row);
            }
        }
        updatePreview();
    }

    function updatePreview() {
        const month = document.getElementById('month').value;
        const year = document.getElementById('year').value;
        const rows = document.querySelectorAll('#entries .entry-row');
        const tbody = document.getElementById('previewBody');
        tbody.innerHTML = '';
        if (!month || !year) return;

        rows.forEach((row, i) => {
            const inputs = row.querySelectorAll('input');
            const day = inputs[0].value;
            if (!day) return;
            const fullDate = String(day).padStart(2, '0') + '.' + String(month).padStart(2, '0') + '.' + year;
            tbody.innerHTML += `<tr><td>${i + 1}</td><td>${fullDate}</td><td>${inputs[1].value}</td><td>${inputs[2].value}</td></tr>`;
        });

        updateButtonStates();
    }

    function updateButtonStates() {
        const rows = document.querySelectorAll('#entries .entry-row');
        rows.forEach((row, i) => {
            const upButton = row.querySelector('.btn-move-up');
            const downButton = row.querySelector('.btn-move-down');
            upButton.disabled = i === 0;
            downButton.disabled = i === rows.length - 1;
        });
    }

    async function generatePreview() {
        const month = document.getElementById('month').value;
        const year = document.getElementById('year').value;
        const docDate = document.getElementById('doc_date').value; // Get date from the new field
        if (!month || !year || !docDate) {
            alert('Please ensure Month, Year, and Document Date are filled out.');
            return;
        }

        const response = await fetch('report-template.html');
        const templateText = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(templateText, 'text/html');

        const monthName = new Date(year, month - 1).toLocaleString('default', { month: 'long' });

        // Populate placeholders
        doc.querySelector('#month-year-heading').textContent = `for the month of ${monthName} ${year}`;
        doc.querySelector('#doc-date').textContent = docDate; // Use the date from the form

        let tableRowsHTML = '';
        document.querySelectorAll('#entries .entry-row').forEach((row, i) => {
            const inputs = row.querySelectorAll('input');
            if (inputs[0].value) {
                const fullDate = String(inputs[0].value).padStart(2, '0') + '.' + String(month).padStart(2, '0') + '.' + year;
                tableRowsHTML += `<tr><td>${i + 1}</td><td>${fullDate}</td><td>${inputs[1].value}</td><td>${inputs[2].value}</td></tr>`;
            }
        });
        doc.querySelector('#schedule-table-body').innerHTML = tableRowsHTML;
        
        const finalHTML = new XMLSerializer().serializeToString(doc);
        const previewTab = window.open();
        previewTab.document.write(finalHTML);
        previewTab.document.close();
    }
    
    // Initial setup
    addRow();
    updatePreview();
</script>
</body>
</html>
